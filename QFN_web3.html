function classify(s){let x=String(s||'').trim();if(!x)return 'blank';if(isTab(x))return 'tab';if(/^\s*(INTRO|RIT|RIT\.|STROFA|STRUMENTALE|FINALE|CHIUSURA|BRIDGE|TAB\d*)/i.test(x))return 'section';let ts=tokens(x);let residual=x.replace(chord,'').replace(/[\s:;,.()\-–—_xX0-9+\/\|]/g,'');if(ts.length && residual.length<4)return 'chord';if(ts.length>=2 && residual.length<18 && x.length<90)return 'chord';return 'lyric'}
function selectedText(line,cls){let original=String(line||'');if(mode.value==='lyrics')return esc(original.replace(chord,'').replace(/\s{2,}/g,' ').trim()||original);if(mode.value==='chords')return esc(tokens(original).map(tLine).join('   '));return esc(tLine(original)).replace(chord,m=>'<span class="tok">'+m+'</span>')}
function renderIndex(filter=''){let f=filter.toLowerCase();let out='';songs.forEach((s,i)=>{let hay=(s.title+' '+s.lines.map(l=>l.text).join(' ')).toLowerCase();if(f&&!hay.includes(f))return;out+=`<a href="#${s.slug}" class="${i===current?'active':''}" data-i="${i}">${favs.includes(s.slug)?'★ ':''}${esc(s.title)}<br><small>${s.lines.length} righe</small></a>`});index.innerHTML=out||'<p>Nessun risultato</p>'}
function renderAlpha(){let letters=['Tutte','★',...Array.from(new Set(songs.map(s=>(s.title||'?').trim()[0]?.toUpperCase()).filter(Boolean))).sort((a,b)=>a.localeCompare(b,'it'))];alpha.innerHTML=letters.map(l=>`<button data-letter="${esc(l)}">${esc(l)}</button>`).join('')}
function filterLetter(l){search.value='';if(l==='Tutte'){renderIndex('');return}let out='';songs.forEach((s,i)=>{let ok=l==='★'?favs.includes(s.slug):(s.title||'').toUpperCase().startsWith(l);if(ok)out+=`<a href="#${s.slug}" class="${i===current?'active':''}" data-i="${i}">${esc(s.title)}<br><small>${s.lines.length} righe</small></a>`});index.innerHTML=out||'<p>Vuoto</p>'}
function renderSong(){let s=songs[current]||songs[0];if(!s)return;title.textContent=s.title;meta.textContent=`${DATA.meta.source} · ${songs.length} sezioni · ${images.length} immagini · trasposizione ${semis>0?'+':''}${semis}`;let out='';for(const obj of s.lines){if(obj.images&&obj.images.length&&mode.value!=='lyrics'&&mode.value!=='chords'){for(const id of obj.images){const im=images[id];if(im)out+=`<div class="imgbox"><img alt="Tablatura incorporata" src="data:${im.mime};base64,${im.data}"></div>`}}let raw=obj.text||'';let cls=classify(raw);if(cls==='blank'){if(mode.value!=='chords')out+='<div class="line">&nbsp;</div>';continue}if(mode.value==='lyrics'&&!(cls==='lyric'||cls==='section'))continue;if(mode.value==='chords'&&cls!=='chord')continue;if(mode.value==='textchords'&&cls==='tab')continue;let shown=selectedText(raw,cls);if(mode.value==='chords'&&!shown.trim())continue;out+=`<div class="line ${cls}">${shown}</div>`}songBox.innerHTML=out||'<p>Nessun contenuto per questa modalità.</p>';favBtn.textContent=favs.includes(s.slug)?'★ Preferito':'☆ Preferito';semiEl.textContent=(semis>0?'+':'')+semis;renderIndex(search.value);history.replaceState(null,'','#'+s.slug);localStorage.setItem('cz_last',s.slug)}
function openSong(i){current=Number(i)||0;side.classList.remove('open');renderSong();window.scrollTo(0,0)}
index.addEventListener('click',e=>{const a=e.target.closest('a[data-i]');if(a){e.preventDefault();openSong(a.dataset.i)}});
alpha.addEventListener('click',e=>{const b=e.target.closest('button[data-letter]');if(b)filterLetter(b.dataset.letter)});
search.addEventListener('input',e=>renderIndex(e.target.value));
mode.addEventListener('change',()=>{settings.mode=mode.value;localStorage.setItem('cz_settings',JSON.stringify(settings));renderSong()});
$('up').onclick=()=>{semis++;renderSong()};$('down').onclick=()=>{semis--;renderSong()};$('reset').onclick=()=>{semis=0;renderSong()};
$('big').onclick=()=>{let fs=parseInt(getComputedStyle(document.documentElement).getPropertyValue('--fs'))||18;fs=Math.min(30,fs+1);document.documentElement.style.setProperty('--fs',fs+'px');settings.fs=fs;localStorage.setItem('cz_settings',JSON.stringify(settings))};
$('small').onclick=()=>{let fs=parseInt(getComputedStyle(document.documentElement).getPropertyValue('--fs'))||18;fs=Math.max(12,fs-1);document.documentElement.style.setProperty('--fs',fs+'px');settings.fs=fs;localStorage.setItem('cz_settings',JSON.stringify(settings))};
$('theme').onclick=()=>{let t=app.getAttribute('data-theme')==='dark'?'light':'dark';app.setAttribute('data-theme',t);settings.theme=t;localStorage.setItem('cz_settings',JSON.stringify(settings))};
favBtn.onclick=()=>{let slug=songs[current].slug;favs=favs.includes(slug)?favs.filter(x=>x!==slug):favs.concat(slug);localStorage.setItem('cz_favs',JSON.stringify(favs));renderSong()};
$('print').onclick=()=>window.print();$('openIndex').onclick=()=>side.classList.toggle('open');
$('scroll').addEventListener('input',e=>{clearInterval(timer);let v=Number(e.target.value);if(v>0)timer=setInterval(()=>window.scrollBy(0,v),180)});
$('count').textContent=`${songs.length} sezioni`;
renderAlpha();let start=location.hash.slice(1)||localStorage.getItem('cz_last');let idx=songs.findIndex(s=>s.slug===start);if(idx>=0)current=idx;renderIndex('');renderSong();
})();
</script></body></html>
